<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in · Automations</title>
<style>
body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f4f6f9;color:#1d2433}
header{background:#1f2a44;color:#fff;padding:18px 28px}
header h1{margin:0;font-size:20px}
header span{opacity:.75;font-size:13px;display:block;margin-top:4px}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 3px #0001;max-width:380px;margin:48px auto;padding:22px 24px}
label{display:block;font-size:13px;color:#556;margin-bottom:6px;font-weight:600}
input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #ccd;border-radius:8px;font-size:15px}
button{margin-top:14px;width:100%;background:#1f2a44;color:#fff;border:0;border-radius:8px;padding:10px;font-weight:700;font-size:15px;cursor:pointer}
.err{background:#fde4e1;color:#b42318;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:12px}
</style>
</head>
<body>
<header><h1>Grok Bot Automations</h1><span>The Service Company</span></header>
<form class="card" method="post" action="/login">
<h2 style="margin:0 0 14px;font-size:18px">Sign in</h2>
<div class="err" id="err">__ERROR__</div>
<input type="hidden" name="next" value="__NEXT__">
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
<button type="submit">Continue</button>
</form>
<script>
if(!document.getElementById('err').textContent.trim()) document.getElementById('err').style.display='none';
</script>
</body>
</html>
